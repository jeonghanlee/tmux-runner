# Local configuration for the tmux-runner server.

# Core behavior: 256-color terminal, deep scrollback matching the
# screen defscrollback depth, mouse wheel scrolling through copy-mode,
# and a short escape delay so vim sees ESC immediately.
set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g mouse on
set -s escape-time 10

# Window numbering starts at 1 and renumbers on close, keeping the
# status line window list gapless.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal capabilities for full-screen TUI agents and editors
# (Claude Code, Codex CLI, vim): RGB truecolor, extended key
# reporting for modifier combos such as Shift+Enter, focus events,
# OSC 52 clipboard integration, and escape sequence passthrough.
set -as terminal-features ",*-256color:RGB"
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
set -s focus-events on
set -s set-clipboard on
set -g allow-passthrough on

# Bells surface as window list flags instead of flashes, so a bell
# from a background agent (for example Claude Code finishing a turn)
# marks that window without interrupting the current one.
set -g visual-bell off
set -g bell-action any

# vi keys in copy-mode.
setw -g mode-keys vi

# Reload this configuration in place.
bind r source-file ~/.config/tmux-runner/tmux.conf \; display-message "tmux.conf reloaded"

# Status line shaped after the screen hardstatus, colored text on the
# plain black bar: detach key hint then host in magenta and load
# average in green at the left, window list centered with the current
# window in bold red, active pane git branch with month-name date and
# clock at the right.
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=black,fg=white"
set -g status-left-length 60
set -g status-left "#[fg=white][C-b d (etach)] #[fg=magenta]#H #[fg=green]#(cut -d' ' -f1-3 /proc/loadavg) #[default] "
set -g status-right-length 60
set -g status-right "#[fg=yellow]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=cyan]%Y/%b/%d #[fg=blue,bold]%H:%M "
setw -g window-status-current-style "fg=red,bold"
