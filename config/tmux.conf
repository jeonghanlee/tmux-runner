# Local configuration for the tmux-runner server.

# Core behavior: 256-color terminal, deep scrollback matching the
# screen defscrollback depth, mouse wheel scrolling through copy-mode,
# and a short escape delay so vim sees ESC immediately.
set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g mouse on
set -s escape-time 10

# Window numbering starts at 1 and renumbers on close, keeping the
# status line window list gapless.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal capabilities for full-screen TUI agents and editors
# (Claude Code, Codex CLI, vim): RGB truecolor, extended key
# reporting for modifier combos such as Shift+Enter, focus events,
# OSC 52 clipboard integration, and escape sequence passthrough.
set -as terminal-features ",*-256color:RGB"
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
set -s focus-events on
set -s set-clipboard on
set -g allow-passthrough on

# Bells surface as window list flags instead of flashes, so a bell
# from a background agent (for example Claude Code finishing a turn)
# marks that window without interrupting the current one.
set -g visual-bell off
set -g bell-action any

# vi keys in copy-mode.
setw -g mode-keys vi

# Korean Dubeolsik aliases for prefix keys c, n, p, w, o, z, x, and d.
# Unicode escapes keep the configuration ASCII-only.
set -g prefix2 "C-\u3160"
bind "\u314a" new-window
bind "\u315c" next-window
bind "\u3154" previous-window
bind "\u3148" choose-tree -Zw
bind "\u3150" select-pane -t :.+
bind "\u314b" resize-pane -Z
bind "\u314c" confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind "\u3147" detach-client

# Reload this configuration in place.
bind r source-file ~/.config/tmux-runner/tmux.conf \; display-message "tmux.conf reloaded"

# Status line shaped after the screen hardstatus, colored text on the
# plain black bar: host in magenta, then memory and disk usage in green
# at the left (m is memory, / is the root filesystem, dN is a separate
# /dataN mount; a /data directory on the root filesystem is skipped),
# window list centered with the current window in bold red, active
# pane folder name and git branch with ISO date and clock at the
# right.
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=black,fg=white"
set -g status-left-length 60
set -g status-left "#[fg=magenta]#H #[fg=green]#({ cat /proc/meminfo; df -P; } | awk '/^MemTotal:/{t=\$2} /^MemAvailable:/{a=\$2} \$6==\"/\"{r=\$1;ru=\$5} substr(\$6,1,5)==\"/data\"{s=substr(\$6,6); if(s !~ /[^0-9]/){n[++c]=\$6;d[\$6]=\$1;u[\$6]=\$5}} END{o=\"m:\" int((t-a)*100/t) \" /:\" int(ru); for(i=1;i<=c;i++){k=n[i]; if(d[k]==r) continue; o=o \" d\" substr(k,6) \":\" int(u[k])} print o}') #[default] "
set -g status-right-length 100
set -g status-right "#[fg=green]#{b;q/h:pane_current_path} #[fg=yellow]#(cd #{q:pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/.*/(&)/') #[fg=cyan]%Y-%m-%d #[fg=blue,bold]%H:%M "
setw -g window-status-current-style "fg=red,bold"
